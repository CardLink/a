<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мырзабекова Алия Залкарбековна</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Manrope', sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.50), transparent 22%),
        radial-gradient(circle at 85% 25%, rgba(255,255,255,0.30), transparent 18%),
        radial-gradient(circle at 50% 85%, rgba(255,255,255,0.18), transparent 24%),
        linear-gradient(145deg, #dfcdd4 0%, #ccb8c0 38%, #bca5af 68%, #e9dfe3 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px 40px;
      color: #171417;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(10px);
      z-index: 0;
    }

    body::before {
      width: 260px;
      height: 260px;
      top: 60px;
      left: -60px;
      background: radial-gradient(circle, rgba(255,255,255,0.30), transparent 68%);
    }

    body::after {
      width: 320px;
      height: 320px;
      right: -90px;
      bottom: 40px;
      background: radial-gradient(circle, rgba(255,255,255,0.20), transparent 70%);
    }

    .card {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 2;
      overflow: hidden;
      border-radius: 34px;
      padding: 28px 22px 24px;
      margin: 28px auto;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.88), rgba(246,238,241,0.94)),
        radial-gradient(circle at top, rgba(255,255,255,0.78), transparent 35%);
      border: 1px solid rgba(255,255,255,0.60);
      box-shadow:
        0 38px 90px rgba(92, 67, 79, 0.22),
        0 18px 38px rgba(92, 67, 79, 0.14),
        0 0 0 1px rgba(255,255,255,0.12),
        inset 0 1px 0 rgba(255,255,255,0.98),
        inset 0 -1px 0 rgba(180, 156, 166, 0.18);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: cardFadeUp 0.7s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 0%, rgba(255,255,255,0.58), transparent 25%),
        linear-gradient(180deg, rgba(255,255,255,0.30), transparent 22%);
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -70px;
      top: -70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.24), transparent 68%);
      pointer-events: none;
      filter: blur(8px);
    }

    .top-row,
    .photo-wrap,
    .name,
    .subname,
    .role,
    .main-btn,
    .actions,
    .insta,
    .qr,
    .footer {
      position: relative;
      z-index: 2;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      flex-wrap: nowrap;
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.82), rgba(237,226,231,0.92));
      border: 1px solid rgba(255,255,255,0.74);
      box-shadow:
        0 10px 22px rgba(119, 89, 101, 0.10),
        inset 0 1px 0 rgba(255,255,255,0.96);
      color: #6a4f59;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: 0.1px;
      min-width: 0;
      max-width: 100%;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    .top-btn {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.90), rgba(233,221,227,0.97));
      border: 1px solid rgba(255,255,255,0.74);
      box-shadow:
        0 10px 20px rgba(119, 89, 101, 0.10),
        inset 0 1px 0 rgba(255,255,255,0.97),
        inset 0 -1px 0 rgba(176, 151, 161, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .top-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 16px 28px rgba(119, 89, 101, 0.16),
        inset 0 1px 0 rgba(255,255,255,0.99),
        inset 0 -1px 0 rgba(176, 151, 161, 0.14);
    }

    .top-btn:active {
      transform: scale(0.97);
    }

    .mini-icon {
      width: 20px;
      height: 20px;
      stroke: #58444c;
      stroke-width: 1.9;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .photo-wrap {
      width: 158px;
      height: 158px;
      margin: 0 auto 22px;
      padding: 6px;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(255,255,255,0.99), rgba(222,204,212,0.98));
      box-shadow:
        0 22px 42px rgba(102, 74, 86, 0.22),
        0 8px 18px rgba(102, 74, 86, 0.10),
        0 0 0 6px rgba(255,255,255,0.26),
        inset 0 1px 0 rgba(255,255,255,0.97),
        inset 0 -2px 8px rgba(181, 155, 166, 0.14);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .photo-wrap:hover {
      transform: translateY(-2px);
      box-shadow:
        0 28px 50px rgba(102, 74, 86, 0.25),
        0 10px 22px rgba(102, 74, 86, 0.12),
        0 0 0 6px rgba(255,255,255,0.30),
        inset 0 1px 0 rgba(255,255,255,0.98),
        inset 0 -2px 8px rgba(181, 155, 166, 0.14);
    }

    .photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.94);
      box-shadow: 0 8px 24px rgba(77, 55, 65, 0.14);
    }

    .name {
      font-size: 34px;
      line-height: 1.02;
      font-weight: 800;
      letter-spacing: -0.9px;
      color: #20181c;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255,255,255,0.35);
      word-break: break-word;
    }

    .subname {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 600;
      color: #654c56;
      text-align: center;
      word-break: break-word;
    }

    .role {
      margin-top: 16px;
      margin-bottom: 22px;
      font-size: 16px;
      font-weight: 700;
      color: #755963;
      text-align: center;
      letter-spacing: 0.1px;
      word-break: break-word;
    }

    .main-btn {
      display: block;
      width: 100%;
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 22px;
      text-decoration: none;
      text-align: center;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      background:
        linear-gradient(135deg, #44323a 0%, #2d2227 55%, #241b20 100%);
      box-shadow:
        0 18px 32px rgba(55, 39, 46, 0.30),
        0 6px 14px rgba(55, 39, 46, 0.18),
        inset 0 1px 0 rgba(255,255,255,0.15),
        inset 0 -1px 0 rgba(0,0,0,0.22);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      position: relative;
      overflow: hidden;
    }

    .main-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 70%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
      transform: skewX(-20deg);
      transition: left 0.65s ease;
    }

    .main-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 22px 36px rgba(55, 39, 46, 0.34),
        0 8px 16px rgba(55, 39, 46, 0.20),
        inset 0 1px 0 rgba(255,255,255,0.17),
        inset 0 -1px 0 rgba(0,0,0,0.22);
      filter: saturate(1.05);
    }

    .main-btn:hover::before {
      left: 140%;
    }

    .main-btn:active {
      transform: scale(0.985);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
      width: 100%;
    }

    .action {
      min-height: 84px;
      text-decoration: none;
      border-radius: 26px;
      padding: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.84), rgba(233,219,225,0.97));
      border: 1px solid rgba(255,255,255,0.74);
      box-shadow:
        0 12px 24px rgba(119, 89, 101, 0.10),
        inset 0 1px 0 rgba(255,255,255,0.97),
        inset 0 -1px 0 rgba(177, 151, 161, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4f3b43;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      position: relative;
      overflow: hidden;
      min-width: 0;
    }

    .action::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.18), transparent 45%);
      pointer-events: none;
    }

    .action:hover {
      transform: translateY(-3px);
      box-shadow:
        0 18px 30px rgba(119, 89, 101, 0.16),
        inset 0 1px 0 rgba(255,255,255,0.99),
        inset 0 -1px 0 rgba(177, 151, 161, 0.10);
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(234,220,226,0.99));
    }

    .action:active {
      transform: scale(0.98);
    }

    .icon-svg {
      width: 28px;
      height: 28px;
      margin-bottom: 0;
      stroke: #5d474f;
      stroke-width: 1.9;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.18s ease, stroke 0.18s ease;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    .action:hover .icon-svg {
      transform: translateY(-1px);
      stroke: #4a373f;
    }

    .label {
      display: none;
    }

    .insta {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 2px auto 0;
      text-decoration: none;
      color: #634a54;
      font-size: 15px;
      font-weight: 700;
      padding-bottom: 3px;
      border-bottom: 1px solid rgba(99, 74, 84, 0.18);
      text-align: center;
      transition: color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
      word-break: break-word;
    }

    .insta:hover {
      color: #4e3942;
      border-color: rgba(78, 57, 66, 0.35);
      transform: translateY(-1px);
    }

    .qr {
      margin-top: 16px;
      display: none;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .qr.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    #qrCodeBox {
      width: 132px;
      height: 132px;
      margin: 0 auto;
      padding: 8px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(244,238,241,0.99));
      border: 1px solid rgba(255,255,255,0.82);
      box-shadow:
        0 16px 30px rgba(119, 89, 101, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.97);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrCodeBox img,
    #qrCodeBox canvas {
      width: 116px !important;
      height: 116px !important;
      border-radius: 10px;
      display: block;
      background: #fff;
    }

    .footer {
      margin-top: 16px;
      text-align: center;
      color: #8f737d;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: 0.1px;
    }

    @keyframes cardFadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px 28px;
        align-items: flex-start;
      }

      .card {
        max-width: 100%;
        padding: 24px 16px 20px;
        border-radius: 28px;
        margin: 0 auto;
      }

      .top-row {
        gap: 8px;
      }

      .badge {
        font-size: 11px;
        min-height: 38px;
        padding: 0 12px;
        white-space: normal;
        line-height: 1.15;
      }

      .top-actions {
        gap: 8px;
      }

      .top-btn {
        width: 40px;
        height: 40px;
        min-width: 40px;
        border-radius: 13px;
      }

      .name {
        font-size: 30px;
      }

      .subname {
        font-size: 16px;
      }

      .role {
        font-size: 14px;
        margin-top: 14px;
        margin-bottom: 20px;
      }

      .photo-wrap {
        width: 146px;
        height: 146px;
        margin-bottom: 20px;
      }

      .main-btn {
        font-size: 16px;
        padding: 17px 14px;
        margin-bottom: 18px;
      }

      .actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .action {
        min-height: 88px;
        border-radius: 24px;
      }

      .icon-svg {
        width: 27px;
        height: 27px;
      }

      .insta {
        font-size: 14px;
      }

      #qrCodeBox {
        width: 124px;
        height: 124px;
      }

      #qrCodeBox img,
      #qrCodeBox canvas {
        width: 108px !important;
        height: 108px !important;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-row">
      <div class="badge">Business Card</div>

      <div class="top-actions">
        <button class="top-btn" onclick="sharePage()" aria-label="Поделиться">
          <svg class="mini-icon" viewBox="0 0 24 24">
            <circle cx="18" cy="5" r="2"></circle>
            <circle cx="6" cy="12" r="2"></circle>
            <circle cx="18" cy="19" r="2"></circle>
            <path d="M8 12l8-6"></path>
            <path d="M8 12l8 6"></path>
          </svg>
        </button>

        <button class="top-btn" onclick="toggleQR()" aria-label="QR-код">
          <svg class="mini-icon" viewBox="0 0 24 24">
            <rect x="3" y="3" width="6" height="6"></rect>
            <rect x="15" y="3" width="6" height="6"></rect>
            <rect x="3" y="15" width="6" height="6"></rect>
            <path d="M15 15h3v3h-3z"></path>
            <path d="M18 18h3v3h-3z"></path>
            <path d="M18 15h3"></path>
            <path d="M15 18v3"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="photo-wrap">
      <img src="photo.jpg" alt="Фото" class="photo">
    </div>

    <div class="name">Мырзабекова</div>
    <div class="subname">Алия Залкарбековна</div>

    <div class="role">Специалист высокого уровня</div>

    <a href="./contact.vcf" class="main-btn" download>Сохранить контакт</a>

    <div class="actions">
      <a href="tel:+996707409850" class="action" aria-label="Позвонить">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.86 19.86 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.86 19.86 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.63 2.62a2 2 0 0 1-.45 2.11L8 9.91a16 16 0 0 0 6.09 6.09l1.46-1.29a2 2 0 0 1 2.11-.45c.84.3 1.72.51 2.62.63A2 2 0 0 1 22 16.92z"/>
        </svg>
        <div class="label">Звонок</div>
      </a>

      <a href="https://wa.me/996707409850" class="action" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path d="M21 12a8 8 0 1 1-3-6"></path>
          <path d="M8 21l1.5-3"></path>
        </svg>
        <div class="label">WhatsApp</div>
      </a>

      <a href="mailto:myrzabekovaalia28@gmail.com" class="action" aria-label="Email">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="M4 7l8 6 8-6"></path>
        </svg>
        <div class="label">Email</div>
      </a>

      <a href="https://instagram.com/aliia_myrzabekovva" class="action" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="0.8" fill="#5d474f" stroke="none"></circle>
        </svg>
        <div class="label">Instagram</div>
      </a>
    </div>

    <a href="https://instagram.com/aliia_myrzabekovva" target="_blank" rel="noopener noreferrer" class="insta">
      @aliia_myrzabekovva
    </a>

    <div class="qr" id="qr">
      <div id="qrCodeBox"></div>
    </div>

    <div class="footer">
      Быстрый доступ к контактам
    </div>
  </div>

  <script>
    let qrGenerated = false;

    function sharePage() {
      if (navigator.share) {
        navigator.share({
          title: 'Мырзабекова Алия Залкарбековна',
          text: 'Цифровая визитка',
          url: window.location.href
        });
      } else {
        navigator.clipboard.writeText(window.location.href)
          .then(() => alert('Ссылка скопирована'))
          .catch(() => alert('Скопируйте ссылку: ' + window.location.href));
      }
    }

    function toggleQR() {
      const qr = document.getElementById('qr');
      const qrBox = document.getElementById('qrCodeBox');

      if (!qrGenerated) {
        qrBox.innerHTML = '';
        new QRCode(qrBox, {
          text: window.location.href,
          width: 116,
          height: 116
        });
        qrGenerated = true;
      }

      if (qr.classList.contains('show')) {
        qr.classList.remove('show');
        setTimeout(() => {
          if (!qr.classList.contains('show')) {
            qr.style.display = 'none';
          }
        }, 250);
      } else {
        qr.style.display = 'block';
        requestAnimationFrame(() => {
          qr.classList.add('show');
        });
      }
    }
  </script>
</body>
</html>
